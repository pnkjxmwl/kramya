# Kramya backend with external Supabase PostgreSQL.
# Use with docs/supabase-migration-plan.md. Preserve existing service identities.
# Strictly a free staging/demo bridge: API sleeps; workers pause while asleep.
# DATABASE_URL must be a private Supabase session-pooler connection with TLS.
# The expired Render Postgres remains declared temporarily to avoid deleting it
# during Blueprint sync. It is not wired to the API and is not a rollback target.
services:
  - name: opd-api
    type: web
    runtime: node
    region: singapore
    plan: free
    healthCheckPath: /health
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @opd/api prisma:generate &&
      pnpm exec turbo run build --filter=@opd/api &&
      pnpm --filter @opd/api prisma:deploy
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Render's load balancer is one proxy hop. Without this every client shares
      # the rate limiter's bucket, because req.ip is the balancer (env.ts).
      - key: TRUST_PROXY_HOPS
        value: '1'

      # PORT is injected by Render; env.ts reads it and main.ts listens on it.

      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: opd-keyvalue
          type: keyvalue
          property: connectionString
      # Supply/preserve existing environment secrets. Do not unintentionally rotate.
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CHECKIN_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # Optional: empty values are supported by the current env schema.
      - key: SENTRY_DSN
        sync: false
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

  - name: opd-keyvalue
    type: keyvalue
    region: singapore
    plan: free
    ipAllowList: []

# Retain the old expired database until the Supabase cutover is verified. Keeping
# its existing resource identity avoids an accidental deletion during the first sync.
databases:
  - name: opd-postgres
    region: singapore
    plan: free
    postgresMajorVersion: "16"
    databaseName: opd
