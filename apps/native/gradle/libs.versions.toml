# Versions are pinned, not ranged. A client that builds differently on two machines is
# a client whose bugs cannot be reproduced.
#
# This combination is chosen for what is already in ~/.gradle on the build machine:
# Kotlin 2.1.20 (compose + serialization plugin markers cached), AGP 8.11.1,
# Gradle 8.14.3, Compose 1.9.0. Changing any one of them means a fresh download and a
# fresh compatibility question.
[versions]
agp = "8.11.1"
kotlin = "2.1.20"
composeBom = "2025.09.00"
coreKtx = "1.15.0"
activityCompose = "1.9.3"
lifecycle = "2.9.0"
navigation = "2.9.0"
okhttp = "4.12.0"
serialization = "1.7.3"
coroutines = "1.9.0"
coil = "3.0.4"
socketio = "2.1.1"
zxing = "3.5.3"
securityCrypto = "1.1.0-alpha06"
junit = "4.13.2"
googleServices = "4.4.2"
firebaseBom = "33.7.0"

[libraries]
core-ktx              = { module = "androidx.core:core-ktx",                                 version.ref = "coreKtx" }
activity-compose      = { module = "androidx.activity:activity-compose",                     version.ref = "activityCompose" }
lifecycle-runtime     = { module = "androidx.lifecycle:lifecycle-runtime-compose",           version.ref = "lifecycle" }
lifecycle-viewmodel   = { module = "androidx.lifecycle:lifecycle-viewmodel-compose",         version.ref = "lifecycle" }
navigation-compose    = { module = "androidx.navigation:navigation-compose",                 version.ref = "navigation" }

compose-bom           = { module = "androidx.compose:compose-bom",                           version.ref = "composeBom" }
compose-ui            = { module = "androidx.compose.ui:ui" }
compose-graphics      = { module = "androidx.compose.ui:ui-graphics" }
compose-foundation    = { module = "androidx.compose.foundation:foundation" }
# material3 is here for exactly one export: `ripple()`, which moved out of foundation in
# Compose 1.7. Nothing in this app is wrapped in MaterialTheme - the design system is
# core/Theme.kt, mirroring apps/mobile/theme.ts.
compose-material3     = { module = "androidx.compose.material3:material3" }
compose-tooling       = { module = "androidx.compose.ui:ui-tooling" }
compose-tooling-prev  = { module = "androidx.compose.ui:ui-tooling-preview" }

okhttp                = { module = "com.squareup.okhttp3:okhttp",                            version.ref = "okhttp" }
serialization-json    = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json",       version.ref = "serialization" }
coroutines-android    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android",       version.ref = "coroutines" }
coil-compose          = { module = "io.coil-kt.coil3:coil-compose",                          version.ref = "coil" }
coil-okhttp           = { module = "io.coil-kt.coil3:coil-network-okhttp",                   version.ref = "coil" }
socketio              = { module = "io.socket:socket.io-client",                             version.ref = "socketio" }
zxing                 = { module = "com.google.zxing:core",                                  version.ref = "zxing" }
security-crypto       = { module = "androidx.security:security-crypto",                      version.ref = "securityCrypto" }
firebase-bom          = { module = "com.google.firebase:firebase-bom",                       version.ref = "firebaseBom" }
firebase-messaging    = { module = "com.google.firebase:firebase-messaging" }

junit                 = { module = "junit:junit",                                            version.ref = "junit" }
coroutines-test       = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test",          version.ref = "coroutines" }
mockwebserver         = { module = "com.squareup.okhttp3:mockwebserver",                     version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application",              version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",         version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose",  version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
google-services      = { id = "com.google.gms.google-services",            version.ref = "googleServices" }
