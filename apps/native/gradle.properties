org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Where the app talks to.
#
# Two values rather than one, mirroring the split in apps/mobile/eas.json: a debug build
# points at a dev machine, a release build at the deployed API. 10.0.2.2 is the host
# loopback as seen from an Android emulator - the same note lib/auth.tsx carries.
#
# Override either from the command line without touching a file:
#   ./gradlew assembleRelease -PapiUrlRelease=https://staging.example.com
apiUrlDebug=http://10.0.2.2:3000
apiUrlRelease=https://opd-api-koes.onrender.com
