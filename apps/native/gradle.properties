org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Where the app talks to.
#
# Debug targets an emulator by default; release targets the deployed API.
# For a USB-connected phone, use adb reverse and override debug to 127.0.0.1.
#
# Override either from the command line without touching a file:
#   ./gradlew assembleRelease -PapiUrlRelease=https://staging.example.com
apiUrlDebug=http://10.0.2.2:3000
apiUrlRelease=https://opd-api-koes.onrender.com
