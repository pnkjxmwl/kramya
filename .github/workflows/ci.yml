name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Test and assemble Kotlin patient app
        working-directory: apps/native
        run: bash gradlew --no-daemon testDebugUnitTest assembleDebug

  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opd
          POSTGRES_PASSWORD: opd_local_dev
          POSTGRES_DB: opd
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U opd -d opd"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12

    env:
      DATABASE_URL: postgresql://opd:opd_local_dev@localhost:5433/opd?schema=public
      REDIS_URL: redis://localhost:6380
      # CI-only throwaway secrets. Real ones come from the platform per environment.
      JWT_ACCESS_SECRET: ci-access-secret-000000000000000000
      JWT_REFRESH_SECRET: ci-refresh-secret-00000000000000000
      CHECKIN_SECRET: ci-checkin-secret-00000000000000000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Prisma client is generated code - CI must build it, never assume it.
      - run: pnpm --filter @opd/api prisma:generate

      # Supabase-only roles are absent from plain Postgres. Model their old broad
      # defaults so the grant-hardening migration is exercised, not just parsed, in CI.
      - name: Add Supabase API roles to migration test database
        run: psql postgresql://opd:opd_local_dev@localhost:5433/opd -v ON_ERROR_STOP=1 -f apps/api/test/sql/prepare-client-role-grants.sql

      # Integration tests need the schema applied, not just the client generated.
      - run: pnpm --filter @opd/api exec prisma migrate deploy

      # Do not let client roles inherit table access now or from future Prisma migrations.
      - name: Verify Supabase API roles are locked out
        run: psql postgresql://opd:opd_local_dev@localhost:5433/opd -v ON_ERROR_STOP=1 -f apps/api/test/sql/verify-client-role-grants.sql

      - name: Verify restricted runtime database role
        run: psql postgresql://opd:opd_local_dev@localhost:5433/opd -v ON_ERROR_STOP=1 -f apps/api/test/sql/verify-runtime-role.sql

      - name: Verify role migration needs no superuser owner
        run: node apps/api/test/sql/runtime-migration-owner.mjs | psql postgresql://opd:opd_local_dev@localhost:5433/opd -v ON_ERROR_STOP=1

      - run: pnpm lint
      - name: Verify backup safety and deployment target checks
        run: node --test scripts/test/*.test.mjs
      - run: pnpm typecheck

      # Build BEFORE seeding and testing, which is a change of order and not just a
      # reshuffle.
      #
      # The seed runs `nest build`, which imports @opd/contracts - a workspace package
      # that does not exist until it is built. And the console walkthrough inside
      # `pnpm test` drives a REAL clinic: it signs in as reception@apollo.test and
      # doctor@apollo.test, seeded accounts with real password hashes and role
      # memberships. That dependency is deliberate - the walkthrough tests the console
      # against a realistic hospital rather than a hand-built stub - so the data has to
      # be there before the tests run, and the build has to be there before the seed.
      #
      # Safe to seed here: the seed refuses to run against a database holding a
      # hospital it did not create, and CI's is always fresh.
      - run: pnpm build
      - run: pnpm --filter @opd/api seed
      - run: pnpm test

      # Owner-backed suites cannot prove row isolation. Use a separate database,
      # a real non-owner login and a pool of two connections for these checks.
      - name: Verify tenant RLS with a restricted database login
        env:
          DATABASE_URL: postgresql://opd:opd_local_dev@127.0.0.1:5433/opd_ci_rls_test?schema=public
          RLS_RUNTIME_TEST: "1"
        run: |
          pnpm --filter @opd/api exec vitest run test/rls-runtime.e2e.test.ts --reporter=json --outputFile=rls-results.json
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const results = require('./apps/api/rls-results.json');
          assert.ok(results.numPassedTests >= 12, 'Restricted-role checks did not run');
          assert.equal(results.numFailedTests, 0);
          assert.equal(results.numPendingTests, 0, 'Restricted-role checks were skipped');
          NODE
